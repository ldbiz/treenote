[package]
name = "treenote"
version = "0.2.0"
description = "Minimalist personal notes application"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "treenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.1.0", features = [] }

[dependencies]
tauri = { version = "=2.4.0", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.0.1"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
tauri-utils = "2"
dirs = "5"
argon2 = "0.5"
fs4 = "1.1"
rfd = { version = "=0.15.3", features = ["common-controls-v6"] }
pulldown-cmark = "0.13"
saphyr = "0.0.12"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.36"
windows-core = "0.60"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"
